# Serves the built app and proxies the API, WebSockets and the low-bandwidth
# pages to the api service, so the browser stays same-origin.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
  listen 80;
  root /usr/share/nginx/html;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # nginx resolves an upstream name once at startup unless the address comes
  # from a variable. Without this, recreating the api container (a new IP)
  # leaves every proxied request returning 502 until nginx is restarted.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api http://api:8080;

  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  location /api/ { proxy_pass $api; }
  location /m/   { proxy_pass $api; }
  location = /docs { proxy_pass $api; }
  location = /openapi.json { proxy_pass $api; }
  location /ws/ {
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 300s;   # outlives the 20 s server ping, matches the ALB idle timeout
  }
  # Hashed assets are immutable; the HTML shell never is.
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
  location / { add_header Cache-Control "no-cache"; try_files $uri /index.html; }
}
